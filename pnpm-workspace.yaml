minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@types/node@26.5.0'

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true
packages: []

allowBuilds:
  simple-git-hooks: true

catalogs:
  build:
    '@iconify-json/carbon': ^1.2.26
    '@vitejs/plugin-vue': ^6.0.8
    jsdom: ^30.0.1
    unocss: ^66.10.0
    unplugin: ^3.3.0
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    unplugin-vue-macros: ^2.14.5
    vite: ^8.2.2
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/node': ^26.5.0
    '@unocss/eslint-plugin': ^66.10.0
    '@vue-macros/volar': ^3.1.4
    '@vue/test-utils': ^2.5.0
    eslint: ^10.10.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.5.0
    simple-git-hooks: ^2.14.0
    taze: ^21.1.0
    typescript: ^6.0.3
    vitest: ^5.0.0
    vue-tsc: ^3.3.11
  frontend:
    '@vueuse/core': ^14.4.0
    vue: ^3.5.42
    vue-router: ^5.3.1
